name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push cancels the check for the previous one: what matters is the
  # state of the branch now, not the history of its states.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests
        # Tricount and Gemini are faked: nothing calls the network, and no real
        # expense is created.
        run: pytest -q

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t splitticket-api:ci .

      - name: Check that the service starts and responds
        run: |
          docker run -d --name ci-api -p 8787:8787 \
            -e SPLITTICKET_SECRET_KEY=clef-de-verification-ci \
            splitticket-api:ci
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/health > /dev/null; then
              curl -s http://127.0.0.1:8787/health
              echo
              docker rm -f ci-api > /dev/null
              exit 0
            fi
            sleep 1
          done
          echo "The service did not respond within 30s:"
          docker logs ci-api
          docker rm -f ci-api > /dev/null
          exit 1
